<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desk Setup & Hardware Directory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f17;
      --sidebar-bg: #111827;
      --card-bg: #1f2937;
      --card-expanded-bg: #162032;
      --border: #374151;
      --border-accent: #4f46e5;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-light: rgba(99, 102, 241, 0.15);
      --badge-owned-bg: rgba(34, 197, 94, 0.15);
      --badge-owned: #4ade80;
      --badge-wishlist-bg: rgba(234, 179, 8, 0.15);
      --badge-wishlist: #fde047;
      --badge-alt-bg: rgba(239, 68, 68, 0.15);
      --badge-alt: #f87171;
      --pro-color: #4ade80;
      --con-color: #f87171;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
      font-size: 14px;
      line-height: 1.5;
    }

    #app {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* Sidebar Navigation */
    sidebar {
      width: 260px;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .brand {
      padding: 20px;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 26px;
      height: 26px;
      background: var(--primary);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    .nav-list {
      list-style: none;
      padding: 12px 8px;
      overflow-y: auto;
      flex-grow: 1;
    }

    .nav-item {
      padding: 10px 12px;
      margin-bottom: 4px;
      border-radius: var(--radius);
      cursor: pointer;
      color: var(--text-muted);
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s ease;
    }

    .nav-item:hover {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text);
    }

    .nav-item.active {
      background-color: var(--primary-light);
      color: var(--primary);
      font-weight: 600;
    }

    .counter-badge {
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Main Viewport */
    main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--sidebar-bg);
    }

    .search-box {
      position: relative;
      width: 340px;
    }

    .search-box input {
      width: 100%;
      padding: 8px 12px 8px 36px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      outline: none;
      font-size: 13px;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .search-box::before {
      content: '🔍';
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 12px;
      opacity: 0.5;
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.15s ease;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text);
    }

    .content-viewport {
      padding: 24px;
      overflow-y: auto;
      flex-grow: 1;
    }

    /* Accordion Product List */
    .product-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .card.expanded {
      background: var(--card-expanded-bg);
      border-color: var(--border-accent);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    /* Card Header Bar (Always Visible) */
    .card-header {
      padding: 16px 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      user-select: none;
    }

    .card-header:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .card-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .product-brand {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .product-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
    }

    .status-badge {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .status-owned { background: var(--badge-owned-bg); color: var(--badge-owned); }
    .status-wishlist { background: var(--badge-wishlist-bg); color: var(--badge-wishlist); }
    .status-alternative { background: var(--badge-alt-bg); color: var(--badge-alt); }

    .top-pick-tag {
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }

    .card-header-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .product-price {
      font-weight: 700;
      font-size: 1rem;
      color: var(--text);
    }

    .expand-toggle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      transition: transform 0.2s ease;
    }

    .card.expanded .expand-toggle {
      transform: rotate(180deg);
      background: var(--primary);
      color: #fff;
    }

    /* Summary Bar */
    .card-summary-bar {
      padding: 0 20px 14px 20px;
      font-size: 13px;
      color: var(--text-muted);
      border-bottom: 1px solid transparent;
    }

    .card.expanded .card-summary-bar {
      border-bottom-color: var(--border);
    }

    /* Expandable Content Area */
    .card-body {
      display: none;
      padding: 20px;
      flex-direction: column;
      gap: 20px;
      animation: fadeIn 0.2s ease-in-out;
    }

    .card.expanded .card-body {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Distinct Section Blocks */
    .section-block {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Specs Grid */
    .properties-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
    }

    .property-pill {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 8px 12px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
    }

    .property-key {
      font-size: 10px;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
    }

    .property-val {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-top: 2px;
    }

    /* Pros & Cons Columns */
    .pro-con-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 768px) {
      .pro-con-grid { grid-template-columns: 1fr; }
    }

    .pro-column, .con-column {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .pro-con-item {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.4;
    }

    .pro-item {
      background: rgba(34, 197, 94, 0.08);
      border: 1px solid rgba(34, 197, 94, 0.2);
      color: #dcfce7;
    }

    .con-item {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #fee2e2;
    }

    /* Bullet Notes Formatting */
    .bullet-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bullet-list li {
      position: relative;
      padding-left: 18px;
      font-size: 13px;
      color: #d1d5db;
      line-height: 1.5;
    }

    .bullet-list li::before {
      content: '•';
      position: absolute;
      left: 0;
      color: var(--primary);
      font-weight: bold;
      font-size: 16px;
      line-height: 1;
    }

    /* Microswitch Mapping Table */
    .switch-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .switch-table th, .switch-table td {
      padding: 8px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    .switch-table th {
      color: var(--text-muted);
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 700;
    }

    /* Software Setup Block */
    .software-box {
      background: rgba(99, 102, 241, 0.05);
      border: 1px solid rgba(99, 102, 241, 0.2);
      padding: 12px;
      border-radius: 6px;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .buy-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .buy-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div id="app">
    <!-- Sidebar -->
    <sidebar>
      <div class="brand">
        <div class="brand-icon">⚡</div>
        <span>Desk Directory</span>
      </div>
      <ul class="nav-list" id="categoryNav"></ul>
    </sidebar>

    <!-- Main Content Area -->
    <main>
      <header>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search mouse, switches, specs, mods...">
        </div>
        <div class="controls-group">
          <button class="btn-action" id="btnExpandAll">Expand All</button>
          <button class="btn-action" id="btnCollapseAll">Collapse All</button>
        </div>
      </header>

      <!-- Viewport -->
      <div class="content-viewport">
        <div class="product-list" id="productList"></div>
      </div>
    </main>
  </div>

<script>
  window.DESK_DATA = {
    // Paste all contents of data.js here
  };
</script>
  <script>
    (function () {
      if (!window.DESK_DATA) {
        document.getElementById('productList').innerHTML = `
          <div class="empty-state">
            <h2>data.js file missing!</h2>
            <p style="margin-top:8px">Please ensure <code>data.js</code> exists in the root folder.</p>
          </div>`;
        return;
      }

      const { categories = [], products = [], microswitches = {} } = window.DESK_DATA;

      // State
      let activeCategory = categories[0]?.id || 'mice';
      let searchQuery = '';
      let expandedCardIds = new Set(); // Tracks open accordions for side-by-side comparison

      // Elements
      const categoryNav = document.getElementById('categoryNav');
      const searchInput = document.getElementById('searchInput');
      const productList = document.getElementById('productList');
      const btnExpandAll = document.getElementById('btnExpandAll');
      const btnCollapseAll = document.getElementById('btnCollapseAll');

      function init() {
        renderNav();
        setupEventListeners();
        handleHashRoute();
        renderProducts();
      }

      function handleHashRoute() {
        const hash = location.hash.replace('#', '');
        if (hash) {
          const matchedCategory = categories.find(c => c.id === hash);
          if (matchedCategory) activeCategory = matchedCategory.id;
        }
      }

      function renderNav() {
        categoryNav.innerHTML = categories.map(cat => {
          const count = products.filter(p => p.category === cat.id).length;
          return `
            <li class="nav-item ${cat.id === activeCategory ? 'active' : ''}" data-cat="${cat.id}">
              <span>${cat.label}</span>
              <span class="counter-badge">${count}</span>
            </li>
          `;
        }).join('');
      }

      function getFilteredProducts() {
        return products.filter(p => {
          const matchesCategory = p.category === activeCategory;
          const query = searchQuery.toLowerCase();
          const matchesSearch = !query || 
            p.name.toLowerCase().includes(query) ||
            p.brand.toLowerCase().includes(query) ||
            (p.tags && p.tags.some(t => t.toLowerCase().includes(query))) ||
            (p.summary && p.summary.toLowerCase().includes(query)) ||
            (p.setupNotes && p.setupNotes.toLowerCase().includes(query));

          return matchesCategory && matchesSearch;
        });
      }

      // Convert long text blocks into concise bullet lists
      function formatConciseBullets(text) {
        if (!text) return '';
        const lines = text.split('\n')
          .map(l => l.trim())
          .filter(l => l.length > 0);
        
        return `<ul class="bullet-list">${lines.map(line => `<li>${line.replace(/^[-•]\s*/, '')}</li>`).join('')}</ul>`;
      }

      function renderProducts() {
        const filtered = getFilteredProducts();

        if (filtered.length === 0) {
          productList.innerHTML = `
            <div class="empty-state">
              <h3>No items match your search</h3>
              <p style="margin-top: 6px;">Try clearing filters or switching category tabs.</p>
            </div>`;
          return;
        }

        productList.innerHTML = filtered.map(item => {
          const isExpanded = expandedCardIds.has(item.id);
          const statusClass = item.status === 'Owned' ? 'status-owned' : (item.status === 'Alternative' ? 'status-alternative' : 'status-wishlist');

          return `
            <div class="card ${isExpanded ? 'expanded' : ''}" id="card-${item.id}">
              <!-- Always Visible Header Bar -->
              <div class="card-header" onclick="window.deskApp.toggleCard('${item.id}')">
                <div class="card-title-group">
                  <span class="product-brand">${item.brand}</span>
                  <span class="product-name">${item.name}</span>
                  <span class="status-badge ${statusClass}">${item.status || 'Wishlist'}</span>
                  ${item.isTopPick ? `<span class="top-pick-tag">★ ${item.topPickBadge || 'Top Pick'}</span>` : ''}
                </div>
                <div class="card-header-meta">
                  <span class="product-price">${item.price || ''}</span>
                  <div class="expand-toggle">▼</div>
                </div>
              </div>

              <!-- Summary Sub-Bar -->
              <div class="card-summary-bar">
                ${item.summary || ''}
              </div>

              <!-- Expanded Detailed Body -->
              <div class="card-body">
                
                <!-- SECTION 1: Technical Properties Grid -->
                ${item.properties ? `
                  <div class="section-block">
                    <div class="section-title">📊 Technical Specifications</div>
                    <div class="properties-grid">
                      ${Object.entries(item.properties).map(([key, val]) => `
                        <div class="property-pill">
                          <span class="property-key">${key}</span>
                          <span class="property-val">${val}</span>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                ` : ''}

                <!-- SECTION 2: Pros & Cons -->
                ${(item.pros || item.cons) ? `
                  <div class="section-block">
                    <div class="section-title">⚖️ Advantages & Disadvantages</div>
                    <div class="pro-con-grid">
                      <div class="pro-column">
                        ${(item.pros || []).map(p => `<div class="pro-con-item pro-item">✓ ${p}</div>`).join('')}
                      </div>
                      <div class="con-column">
                        ${(item.cons || []).map(c => `<div class="pro-con-item con-item">✕ ${c}</div>`).join('')}
                      </div>
                    </div>
                  </div>
                ` : ''}

                <!-- SECTION 3: Per-Button Microswitch Recommendations -->
                ${(item.buttonSwitchMapping && item.buttonSwitchMapping.length > 0) ? `
                  <div class="section-block">
                    <div class="section-title">🔌 Per-Button Microswitch Configuration</div>
                    <table class="switch-table">
                      <thead>
                        <tr>
                          <th>Button Zone</th>
                          <th>Recommended Switch</th>
                          <th>Tactile & Acoustic Reason</th>
                        </tr>
                      </thead>
                      <tbody>
                        ${item.buttonSwitchMapping.map(m => {
                          const sw = microswitches[m.recommendedSwitchId] || {};
                          return `
                            <tr>
                              <td><strong>${m.buttonGroup}</strong></td>
                              <td>
                                <div><strong>${sw.name || m.recommendedSwitchId}</strong></div>
                                <div style="color:var(--text-muted); font-size:11px;">${sw.force || ''} | ${sw.lifespan || ''}</div>
                              </td>
                              <td style="color:var(--text-muted);">${m.reason || sw.feel || ''}</td>
                            </tr>
                          `;
                        }).join('')}
                      </tbody>
                    </table>
                  </div>
                ` : ''}

                <!-- SECTION 4: Short & Concise Modding / Hardware Notes -->
                ${item.setupNotes ? `
                  <div class="section-block">
                    <div class="section-title">🔧 Modding & Hardware Bullet Notes</div>
                    ${formatConciseBullets(item.setupNotes)}
                  </div>
                ` : ''}

                <!-- SECTION 5: Software & Macro Profile Config -->
                ${item.softwareSetup ? `
                  <div class="section-block">
                    <div class="section-title">🎛 Software & Macro Layout</div>
                    <div class="software-box">
                      ${item.softwareSetup.agentRequirement ? `<div><strong>Runtime:</strong> ${item.softwareSetup.agentRequirement}</div>` : ''}
                      ${item.softwareSetup.baseLayer ? `<div><strong>Base Layer:</strong> ${item.softwareSetup.baseLayer}</div>` : ''}
                      ${item.softwareSetup.gShiftLayer ? `<div><strong>G-Shift Layer:</strong> ${item.softwareSetup.gShiftLayer}</div>` : ''}
                    </div>
                  </div>
                ` : ''}

                <!-- Footer External Purchase Link -->
                ${item.purchaseUrl ? `
                  <div style="display:flex; justify-content:flex-end; padding-top:4px;">
                    <a href="${item.purchaseUrl}" target="_blank" class="buy-link">Official Product Page / Buy Link ↗</a>
                  </div>
                ` : ''}

              </div>
            </div>
          `;
        }).join('');
      }

      function toggleCard(id) {
        if (expandedCardIds.has(id)) {
          expandedCardIds.delete(id);
        } else {
          expandedCardIds.add(id);
        }
        renderProducts();
      }

      function setupEventListeners() {
        categoryNav.addEventListener('click', (e) => {
          const navItem = e.target.closest('.nav-item');
          if (!navItem) return;
          activeCategory = navItem.dataset.cat;
          location.hash = activeCategory;
          expandedCardIds.clear(); // Reset expansion on category change
          renderNav();
          renderProducts();
        });

        searchInput.addEventListener('input', (e) => {
          searchQuery = e.target.value;
          renderProducts();
        });

        btnExpandAll.addEventListener('click', () => {
          const filtered = getFilteredProducts();
          filtered.forEach(p => expandedCardIds.add(p.id));
          renderProducts();
        });

        btnCollapseAll.addEventListener('click', () => {
          expandedCardIds.clear();
          renderProducts();
        });
      }

      window.deskApp = { toggleCard };

      init();
    })();
  </script>
</body>
</html>
