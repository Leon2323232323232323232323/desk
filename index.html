<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desk Setup & Hardware Directory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f17;
      --sidebar-bg: #111827;
      --card-bg: #1f2937;
      --card-expanded-bg: #162032;
      --border: #374151;
      --border-accent: #6366f1;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --text-faint: #6b7280;
      --primary: #6366f1;
      --primary-light: rgba(99, 102, 241, 0.15);
      --badge-owned-bg: rgba(34, 197, 94, 0.15);
      --badge-owned: #4ade80;
      --badge-wishlist-bg: rgba(234, 179, 8, 0.15);
      --badge-wishlist: #fde047;
      --badge-alt-bg: rgba(239, 68, 68, 0.15);
      --badge-alt: #f87171;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
      font-size: 14px;
      line-height: 1.5;
    }

    #app { display: flex; width: 100%; height: 100%; }

    sidebar {
      width: 250px;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .brand {
      padding: 18px 20px;
      font-size: 1.1rem;
      font-weight: 700;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 26px;
      height: 26px;
      background: var(--primary);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    .nav-list { list-style: none; padding: 12px 8px; overflow-y: auto; flex-grow: 1; }

    .nav-item {
      padding: 10px 12px;
      margin-bottom: 4px;
      border-radius: var(--radius);
      cursor: pointer;
      color: var(--text-muted);
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s ease;
    }

    .nav-item:hover { background-color: rgba(255, 255, 255, 0.05); color: var(--text); }
    .nav-item.active { background-color: var(--primary-light); color: var(--primary); font-weight: 600; }

    .counter-badge {
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      color: var(--text-muted);
    }

    main { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }

    header {
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--sidebar-bg);
    }

    .search-box { position: relative; width: 340px; }

    .search-box input {
      width: 100%;
      padding: 8px 12px 8px 36px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      outline: none;
      font-size: 13px;
    }

    .search-box input:focus { border-color: var(--primary); }
    .search-box::before {
      content: '🔍';
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 12px;
      opacity: 0.5;
    }

    .controls-group { display: flex; align-items: center; gap: 10px; }

    .btn-action {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }

    .btn-action:hover { background: rgba(255, 255, 255, 0.12); color: var(--text); }

    .meta-bar {
      display: flex; flex-direction: column; gap: 6px;
      padding: 2px 2px 18px; border-bottom: 1px solid var(--border); margin-bottom: 18px;
    }
    .meta-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
    .meta-stats { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; font-size: 12px; color: var(--text-muted); }
    .meta-stats strong { color: var(--text); }
    .meta-divider { color: var(--text-faint); opacity: 0.4; }
    .invested-value { color: var(--primary); font-weight: 600; }
    .filter-chips { display: flex; gap: 6px; }
    .chip {
      all: unset; cursor: pointer;
      font-size: 11px; padding: 5px 11px; border-radius: 20px;
      border: 1px solid var(--border); color: var(--text-muted);
      transition: all .15s ease;
    }
    .chip:hover { border-color: var(--primary); color: var(--text); }
    .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }

    .content-viewport { padding: 20px; overflow-y: auto; flex-grow: 1; scroll-behavior: smooth; }

    .comparison-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(460px, 1fr));
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 1080px) { .comparison-grid { grid-template-columns: 1fr; } }

    .card {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(0,0,0,.35); }
    .card.expanded {
      background: var(--card-expanded-bg);
      border-color: var(--border-accent);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .card::before, .card::after {
      content: ''; position: absolute; width: 12px; height: 12px; pointer-events: none; opacity: 0.4;
    }
    .card::before { top: -1px; left: -1px; border-top: 2px solid var(--primary); border-left: 2px solid var(--primary); }
    .card::after { bottom: -1px; right: -1px; border-bottom: 2px solid var(--primary); border-right: 2px solid var(--primary); }
    .card:hover::before, .card:hover::after, .card.expanded::before, .card.expanded::after { opacity: 1; }

    .card-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(0, 0, 0, 0.2);
    }

    .card-title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .product-brand { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .product-name { font-size: 1.15rem; font-weight: 700; color: var(--text); }

    .status-badge {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .status-owned { background: var(--badge-owned-bg); color: var(--badge-owned); }
    .status-wishlist { background: var(--badge-wishlist-bg); color: var(--badge-wishlist); }
    .status-alternative { background: var(--badge-alt-bg); color: var(--badge-alt); }

    .top-pick-tag {
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      display: inline-block;
    }

    .card-summary { font-size: 13px; color: var(--text-muted); line-height: 1.4; }

    .quick-specs-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.15);
      border-bottom: 1px solid var(--border);
    }

    .spec-pill-interactive {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 10px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .spec-pill-interactive:hover {
      background: var(--primary-light);
      border-color: var(--primary);
    }

    .spec-key { font-size: 10px; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
    .spec-val { font-size: 12px; font-weight: 600; color: var(--text); margin-top: 2px; }

    .card-expand-bar {
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.02);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      font-size: 12px;
      font-weight: 600;
      color: var(--primary);
    }

    .card-expand-bar:hover { background: rgba(99, 102, 241, 0.08); }

    .card-scroll-body {
      display: none;
      padding: 16px;
      flex-direction: column;
      gap: 12px;
      border-top: 1px solid var(--border);
    }

    .card.expanded .card-scroll-body { display: flex; }

    .sub-accordion {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      scroll-margin-top: 80px;
    }

    .sub-accordion-header {
      padding: 12px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      background: rgba(255, 255, 255, 0.02);
      transition: background 0.15s ease;
    }

    .sub-accordion-header:hover { background: rgba(255, 255, 255, 0.06); }
    .sub-accordion-title { display: flex; align-items: center; gap: 8px; color: var(--primary); }

    .sub-accordion-arrow {
      font-size: 10px;
      color: var(--text-muted);
      transition: transform 0.2s ease;
    }

    .sub-accordion.active .sub-accordion-arrow { transform: rotate(180deg); color: var(--primary); }

    .sub-accordion-body {
      display: none;
      padding: 14px;
      border-top: 1px solid var(--border);
      flex-direction: column;
      gap: 12px;
      background: rgba(0, 0, 0, 0.15);
    }

    .sub-accordion.active .sub-accordion-body { display: flex; }

    .pro-con-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .pro-con-item { font-size: 12px; padding: 6px 8px; border-radius: 6px; line-height: 1.3; }
    .pro-item { background: rgba(34, 197, 94, 0.08); border: 1px solid rgba(34, 197, 94, 0.2); color: #dcfce7; }
    .con-item { background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.2); color: #fee2e2; }

    .bullet-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .bullet-list li {
      position: relative;
      padding-left: 16px;
      font-size: 12px;
      color: #d1d5db;
      line-height: 1.4;
    }

    .bullet-list li::before {
      content: '•';
      position: absolute;
      left: 0;
      color: var(--primary);
      font-weight: bold;
    }

    .comparison-box {
      background: rgba(99, 102, 241, 0.05);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 12px;
      color: #e2e8f0;
      line-height: 1.4;
    }

    .lifespan-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 8px;
    }

    .lifespan-pill {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 10px;
      border-radius: 6px;
    }

    .copy-item-card {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .btn-copy {
      background: var(--primary-light);
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn-copy:hover {
      background: var(--primary);
      color: #fff;
    }

    .switch-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .switch-table th, .switch-table td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--border); }
    .switch-table th { color: var(--text-muted); font-size: 10px; text-transform: uppercase; font-weight: 700; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .buy-link { color: var(--primary); text-decoration: none; font-weight: 600; font-size: 12px; }
    .buy-link:hover { text-decoration: underline; }
  </style>
</head>

  <!-- ================== APPLICATION LOGIC ================== -->
  <script>
    (function () {
      const productList = document.getElementById('productList');

      const { categories = [], products = [], microswitches = {} } = window.DESK_DATA;

      let activeCategory = categories[0]?.id || 'mice';
      let searchQuery = '';
      let statusFilter = 'all';
      let expandedCardIds = new Set();
      let activeSubSections = new Set();

      const categoryNav = document.getElementById('categoryNav');
      const searchInput = document.getElementById('searchInput');
      const btnExpandAll = document.getElementById('btnExpandAll');
      const btnCollapseAll = document.getElementById('btnCollapseAll');

      function init() {
        renderNav();
        setupEventListeners();
        handleHashRoute();
        renderMetaBar();
        renderProducts();
      }

      function handleHashRoute() {
        const hash = location.hash.replace('#', '');
        if (hash) {
          const matchedCategory = categories.find(c => c.id === hash);
          if (matchedCategory) activeCategory = matchedCategory.id;
        }
      }

      function renderNav() {
        categoryNav.innerHTML = categories.map(cat => {
          const count = products.filter(p => p && p.category === cat.id).length;
          return `
            <li class="nav-item ${cat.id === activeCategory ? 'active' : ''}" data-cat="${cat.id}">
              <span>${cat.label}</span>
              <span class="counter-badge">${count}</span>
            </li>
          `;
        }).join('');
      }

      function parsePrice(str) {
        if (!str) return NaN;
        const nums = String(str).match(/[\d,]+(?:\.\d+)?/g);
        if (!nums || !nums.length) return NaN;
        const vals = nums.map(n => parseFloat(n.replace(/,/g, '')));
        return vals.reduce((a, b) => a + b, 0) / vals.length;
      }

      function getFilteredProducts() {
        return products.filter(p => {
          if (!p) return false;
          const matchesCategory = p.category === activeCategory;
          if (statusFilter !== 'all' && p.status !== statusFilter) return false;
          const query = searchQuery.toLowerCase();
          return matchesCategory && (!query ||
            (p.name && p.name.toLowerCase().includes(query)) ||
            (p.brand && p.brand.toLowerCase().includes(query)) ||
            (p.tags && Array.isArray(p.tags) && p.tags.some(t => String(t).toLowerCase().includes(query))) ||
            (p.summary && p.summary.toLowerCase().includes(query))
          );
        });
      }

      function renderMetaBar() {
        const catItems = products.filter(p => p && p.category === activeCategory);
        const filtered = getFilteredProducts();
        const ownedCount = catItems.filter(p => p.status === 'Owned').length;
        const wishCount = catItems.filter(p => p.status === 'Wishlist').length;
        const altCount = catItems.filter(p => p.status === 'Alternative').length;
        const invested = catItems.filter(p => p.status === 'Owned').reduce((sum, p) => sum + (parsePrice(p.price) || 0), 0);
        const metaBarEl = document.getElementById('metaBar');
        if (!metaBarEl) return;
        metaBarEl.innerHTML = `
          <div class="meta-row">
            <div class="meta-stats">
              <span><strong>${filtered.length}</strong> shown</span><span class="meta-divider">/</span>
              <span><strong>${catItems.length}</strong> logged</span>
              ${catItems.length ? `
                <span class="meta-divider">·</span>
                <span style="color:var(--badge-owned);">${ownedCount} owned</span>
                <span style="color:var(--badge-wishlist);">${wishCount} wishlist</span>
                <span style="color:var(--badge-alt);">${altCount} alt</span>
                <span class="meta-divider">·</span>
                <span class="invested-value">$${invested.toFixed(0)} invested</span>
              ` : ''}
            </div>
            <div class="filter-chips">
              ${['all', 'Owned', 'Wishlist', 'Alternative'].map(s => `
                <button class="chip ${statusFilter === s ? 'active' : ''}" data-status="${s}">${s === 'all' ? 'All' : s}</button>
              `).join('')}
            </div>
          </div>`;
      }

      function getQuickSpecPills(item) {
        const props = (item.properties && typeof item.properties === 'object') ? item.properties : {};
        const ergo = (item.ergonomicDetails && typeof item.ergonomicDetails === 'object') ? item.ergonomicDetails : null;
        const procList = Array.isArray(item.procurement) ? item.procurement : [];
        const repair = (item.repairability && typeof item.repairability === 'object') ? item.repairability : null;
        const lifespan = (item.lifespanEstimates && typeof item.lifespanEstimates === 'object') ? item.lifespanEstimates : null;
        const panelInfo = (item.panelDetails && typeof item.panelDetails === 'object') ? item.panelDetails : null;

        if (activeCategory === 'monitors') {
          return `
            <div class="spec-pill-interactive" onclick="window.deskApp.openAndJump('${item.id}', 'ergonomics')">
              <span class="spec-key">Screen Size ↗</span>
              <span class="spec-val">${props["Screen Size"] || 'N/A'}</span>
            </div>
            <div class="spec-pill-interactive" onclick="window.deskApp.openAndJump('${item.id}', 'properties')">
              <span class="spec-key">Refresh Rate ↗</span>
              <span class="spec-val">${props["Refresh Rate"] || 'N/A'}</span>
            </div>
            <div class="spec-pill-interactive" onclick="window.deskApp.openAndJump('${item.id}', 'panel')">
              <span class="spec-key">Panel Tech ↗</span>
              <span class="spec-val">${panelInfo ? panelInfo.panelTech : 'N/A'}</span>
            </div>
            <div class="spec-pill-interactive" onclick="window.deskApp.openAndJump('${item.id}', 'panel')">
              <span class="spec-key">Color Accuracy ↗</span>
              <span class="spec-val">${panelInfo ? panelInfo.colorGamut : 'N/A'}</span>
            </div>
          `;
        }

        return `
          <div class="spec-pill-interactive" onclick="window.deskApp.openAndJump('${item.id}', 'ergonomics')">
            <span class="spec-key">Ergonomic Score ↗</span>
            <span class="spec-val">${props["Ergonomic Rating"] || 'N/A'}</span>
          </div>
          <div class="spec-pill-interactive" onclick="window.deskApp.openAndJump('${item.id}', 'lifespan')">
            <span class="spec-key">Modded Life ↗</span>
            <span class="spec-val">${lifespan ? lifespan.moddedSwitchesLife : 'N/A'}</span>
          </div>
          <div class="spec-pill-interactive" onclick="window.deskApp.openAndJump('${item.id}', 'procurement')">
            <span class="spec-key">Taobao Parts Copy ↗</span>
            <span class="spec-val">${procList.length} Items</span>
          </div>
          <div class="spec-pill-interactive" onclick="window.deskApp.openAndJump('${item.id}', 'repairability')">
            <span class="spec-key">Repair Risk Score ↗</span>
            <span class="spec-val">${repair ? repair.score : 'N/A'}</span>
          </div>
        `;
      }

      function renderProducts() {
        try {
          const filtered = getFilteredProducts();

          if (filtered.length === 0) {
            productList.innerHTML = `
              <div class="empty-state">
                <h3>No items match your search</h3>
                <p style="margin-top: 6px;">Try clearing search filters or selecting another category.</p>
              </div>`;
            return;
          }

          productList.innerHTML = filtered.map(item => {
            const isExpanded = expandedCardIds.has(item.id);
            const statusClass = item.status === 'Owned' ? 'status-owned' : (item.status === 'Alternative' ? 'status-alternative' : 'status-wishlist');
            const props = (item.properties && typeof item.properties === 'object') ? item.properties : {};
            const ergo = (item.ergonomicDetails && typeof item.ergonomicDetails === 'object') ? item.ergonomicDetails : null;
            const stockList = Array.isArray(item.stockSwitchesList) ? item.stockSwitchesList : [];
            const modsList = Array.isArray(item.modsAndAddons) ? item.modsAndAddons : [];
            const procList = Array.isArray(item.procurement) ? item.procurement : [];
            const repair = (item.repairability && typeof item.repairability === 'object') ? item.repairability : null;
            const balance = (item.weightBalance && typeof item.weightBalance === 'object') ? item.weightBalance : null;
            const software = (item.softwareConfig && typeof item.softwareConfig === 'object') ? item.softwareConfig : null;
            const glides = (item.glidesAndPad && typeof item.glidesAndPad === 'object') ? item.glidesAndPad : null;
            const lifespan = (item.lifespanEstimates && typeof item.lifespanEstimates === 'object') ? item.lifespanEstimates : null;
            const pros = Array.isArray(item.pros) ? item.pros : [];
            const cons = Array.isArray(item.cons) ? item.cons : [];
            const setupNotes = Array.isArray(item.setupNotes) ? item.setupNotes : (item.setupNotes ? [String(item.setupNotes)] : []);
            const switchMappings = Array.isArray(item.buttonSwitchMapping) ? item.buttonSwitchMapping : [];
            const panelInfo = (item.panelDetails && typeof item.panelDetails === 'object') ? item.panelDetails : null;

            return `
              <div class="card ${isExpanded ? 'expanded' : ''}" id="card-${item.id}">
                <div class="card-header">
                  <div class="card-title-row">
                    <div>
                      <span class="product-brand">${item.brand || 'Generic'}</span>
                      <div class="product-name">${item.name || 'Product'}</div>
                    </div>
                    <span class="status-badge ${statusClass}">${item.status || 'Wishlist'}</span>
                  </div>
                  ${item.isTopPick ? `<div><span class="top-pick-tag">★ ${item.topPickBadge || 'Top Pick'}</span></div>` : ''}
                  <div class="card-summary">${item.summary || ''}</div>
                </div>
                <div class="quick-specs-grid">
                  ${getQuickSpecPills(item)}
                </div>
                <div class="card-scroll-body">
                  ${activeCategory === 'monitors' && panelInfo ? `
                    <div class="sub-accordion ${activeSubSections.has(`${item.id}:panel`) ? 'active' : ''}" id="sub-${item.id}-panel">
                      <div class="sub-accordion-header" onclick="window.deskApp.toggleSub('${item.id}', 'panel')">
                        <span class="sub-accordion-title">📺 Panel, Color & OSD Calibration</span>
                        <span class="sub-accordion-arrow">▼</span>
                      </div>
                      <div class="sub-accordion-body">
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
                          <div class="lifespan-pill"><div class="spec-key">Panel Technology</div><div class="spec-val">${panelInfo.panelTech}</div></div>
                          <div class="lifespan-pill"><div class="spec-key">Color Gamut</div><div class="spec-val">${panelInfo.colorGamut}</div></div>
                          <div class="lifespan-pill"><div class="spec-key">Delta E (sRGB)</div><div class="spec-val">${panelInfo.deltaE}</div></div>
                          <div class="lifespan-pill"><div class="spec-key">Response Time (GtG)</div><div class="spec-val">${props["Response Time"] || 'N/A'}</div></div>
                        </div>
                        <div class="comparison-box"><strong>🎯 Recommended OSD Calibration Preset:</strong><p>${panelInfo.osdPreset}</p></div>
                        ${panelInfo.iccProfile ? `<div class="comparison-box"><strong>📁 ICC Profile Download / Calibration Notes:</strong><p>${panelInfo.iccProfile}</p></div>` : ''}
                      </div>
                    </div>
                  ` : ''}

                  ${procList.length > 0 ? `
                    <div class="sub-accordion ${activeSubSections.has(`${item.id}:procurement`) ? 'active' : ''}" id="sub-${item.id}-procurement">
                      <div class="sub-accordion-header" onclick="window.deskApp.toggleSub('${item.id}', 'procurement')">
                        <span class="sub-accordion-title">🛒 1-Click Taobao / Procurement Search String Copy Box</span>
                        <span class="sub-accordion-arrow">▼</span>
                      </div>
                      <div class="sub-accordion-body">
                        ${procList.map(p => `
                          <div class="copy-item-card">
                            <div><strong>${p.label}</strong><div style="color:#fde047;">${p.cnTerm}</div></div>
                            <button class="btn-copy" onclick="window.deskApp.copyText('${p.cnTerm}', this)">Copy CN Term</button>
                          </div>
                        `).join('')}
                      </div>
                    </div>
                  ` : ''}

                  ${ergo ? `
                    <div class="sub-accordion ${activeSubSections.has(`${item.id}:ergonomics`) ? 'active' : ''}" id="sub-${item.id}-ergonomics">
                      <div class="sub-accordion-header" onclick="window.deskApp.toggleSub('${item.id}', 'ergonomics')">
                        <span class="sub-accordion-title">📐 Deep Ergonomic Shape & Contour Analysis</span>
                        <span class="sub-accordion-arrow">▼</span>
                      </div>
                      <div class="sub-accordion-body">
                        <p>${ergo.scoreReason}</p>
                      </div>
                    </div>
                  ` : ''}

                  ${(pros.length > 0 || cons.length > 0) ? `
                    <div class="sub-accordion ${activeSubSections.has(`${item.id}:proscons`) ? 'active' : ''}" id="sub-${item.id}-proscons">
                      <div class="sub-accordion-header" onclick="window.deskApp.toggleSub('${item.id}', 'proscons')">
                        <span class="sub-accordion-title">⚖️ Advantages & Disadvantages</span>
                        <span class="sub-accordion-arrow">▼</span>
                      </div>
                      <div class="sub-accordion-body">
                        <div class="pro-con-grid">
                          <div class="pro-con-col">${pros.map(p => `<div class="pro-con-item pro-item">✓ ${p}</div>`).join('')}</div>
                          <div class="pro-con-col">${cons.map(c => `<div class="pro-con-item con-item">✕ ${c}</div>`).join('')}</div>
                        </div>
                      </div>
                    </div>
                  ` : ''}

                  ${setupNotes.length > 0 ? `
                    <div class="sub-accordion ${activeSubSections.has(`${item.id}:notes`) ? 'active' : ''}" id="sub-${item.id}-notes">
                      <div class="sub-accordion-header" onclick="window.deskApp.toggleSub('${item.id}', 'notes')">
                        <span class="sub-accordion-title">🔧 Step-by-Step Modding & Wiring Bullet Notes</span>
                        <span class="sub-accordion-arrow">▼</span>
                      </div>
                      <div class="sub-accordion-body">
                        <ul class="bullet-list">${setupNotes.map(n => `<li>${n}</li>`).join('')}</ul>
                      </div>
                    </div>
                  ` : ''}

                  ${item.purchaseUrl ? `<div style="display:flex; justify-content:flex-end; padding-top:4px;"><a href="${item.purchaseUrl}" target="_blank" class="buy-link">Official Buy Page ↗</a></div>` : ''}
                </div>
                <div class="card-expand-bar" onclick="window.deskApp.toggleCard('${item.id}')">
                  <span>${isExpanded ? '▲ Close Card Sections' : '▼ Expand Sub-Sections'}</span>
                  <span>${item.price || ''}</span>
                </div>
              </div>
            `;
          }).join('');
        } catch (err) {
          productList.innerHTML = `<div class="empty-state"><h3>Error rendering directory</h3><p style="color:#f87171;">${err.message}</p></div>`;
        }
      }

      function toggleCard(id) {
        if (expandedCardIds.has(id)) expandedCardIds.delete(id);
        else expandedCardIds.add(id);
        renderProducts();
      }

      function toggleSub(cardId, subSectionKey) {
        const key = `${cardId}:${subSectionKey}`;
        if (activeSubSections.has(key)) activeSubSections.delete(key);
        else activeSubSections.add(key);
        renderProducts();
      }

      function openAndJump(cardId, subSectionKey) {
        expandedCardIds.add(cardId);
        activeSubSections.add(`${cardId}:${subSectionKey}`);
        renderProducts();
        setTimeout(() => {
          const targetEl = document.getElementById(`sub-${cardId}-${subSectionKey}`);
          if (targetEl) targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          else {
            const cardEl = document.getElementById(`card-${cardId}`);
            if (cardEl) cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }, 60);
      }

      function copyText(str, btnEl) {
        navigator.clipboard.writeText(str).then(() => {
          const orig = btnEl.innerText;
          btnEl.innerText = 'Copied! ✓';
          btnEl.style.background = '#22c55e';
          btnEl.style.color = '#fff';
          setTimeout(() => {
            btnEl.innerText = orig;
            btnEl.style.background = '';
            btnEl.style.color = '';
          }, 1500);
        }).catch(() => { alert('Copy failed: ' + str); });
      }

      function setupEventListeners() {
        const metaBar = document.getElementById('metaBar');
        if (metaBar) {
          metaBar.addEventListener('click', (e) => {
            const chip = e.target.closest('.chip');
            if (!chip) return;
            statusFilter = chip.dataset.status;
            renderMetaBar();
            renderProducts();
          });
        }

        categoryNav.addEventListener('click', (e) => {
          const navItem = e.target.closest('.nav-item');
          if (!navItem) return;
          activeCategory = navItem.dataset.cat;
          statusFilter = 'all';
          location.hash = activeCategory;
          expandedCardIds.clear();
          activeSubSections.clear();
          renderNav();
          renderMetaBar();
          renderProducts();
        });

        searchInput.addEventListener('input', (e) => {
          searchQuery = e.target.value;
          renderProducts();
        });

        btnExpandAll.addEventListener('click', () => {
          const filtered = getFilteredProducts();
          filtered.forEach(p => {
            expandedCardIds.add(p.id);
            ['procurement','repairability','weight','software','glides','lifespan','stock','mods','ergonomics','properties','switches','proscons','notes'].forEach(k => activeSubSections.add(`${p.id}:${k}`));
            if (activeCategory === 'monitors') activeSubSections.add(`${p.id}:panel`);
          });
          renderProducts();
        });

        btnCollapseAll.addEventListener('click', () => {
          expandedCardIds.clear();
          activeSubSections.clear();
          renderProducts();
        });
      }

      window.deskApp = { toggleCard, toggleSub, openAndJump, copyText };
      init();
    })();
  </script>
</body>
</html>
