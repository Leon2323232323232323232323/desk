<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desk Setup & Hardware Directory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f17;
      --sidebar-bg: #111827;
      --card-bg: #1f2937;
      --card-expanded-bg: #162032;
      --border: #374151;
      --border-accent: #6366f1;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --text-faint: #6b7280;
      --primary: #6366f1;
      --primary-light: rgba(99, 102, 241, 0.15);
      --badge-owned-bg: rgba(34, 197, 94, 0.15);
      --badge-owned: #4ade80;
      --badge-wishlist-bg: rgba(234, 179, 8, 0.15);
      --badge-wishlist: #fde047;
      --badge-alt-bg: rgba(239, 68, 68, 0.15);
      --badge-alt: #f87171;
      --radius: 10px;
      --compare-bg: #0d1317;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
      font-size: 14px;
      line-height: 1.5;
    }
    #app { display: flex; width: 100%; height: 100%; }

    sidebar {
      width: 250px;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .brand { padding: 18px 20px; font-size: 1.1rem; font-weight: 700; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
    .brand-icon { width: 26px; height: 26px; background: var(--primary); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 13px; }
    .nav-list { list-style: none; padding: 12px 8px; overflow-y: auto; flex-grow: 1; }
    .nav-item {
      padding: 10px 12px; margin-bottom: 4px; border-radius: var(--radius); cursor: pointer;
      color: var(--text-muted); font-weight: 500; display: flex; align-items: center;
      justify-content: space-between; transition: all 0.15s ease;
    }
    .nav-item:hover { background-color: rgba(255, 255, 255, 0.05); color: var(--text); }
    .nav-item.active { background-color: var(--primary-light); color: var(--primary); font-weight: 600; }
    .counter-badge { background: rgba(255, 255, 255, 0.08); padding: 2px 8px; border-radius: 12px; font-size: 11px; color: var(--text-muted); }

    main { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
    header {
      padding: 14px 24px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      background: var(--sidebar-bg);
    }
    .search-box { position: relative; width: 340px; }
    .search-box input {
      width: 100%; padding: 8px 12px 8px 36px; background: var(--bg);
      border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--text); outline: none; font-size: 13px;
    }
    .search-box input:focus { border-color: var(--primary); }
    .search-box::before { content: '🔍'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; opacity: 0.5; }
    .controls-group { display: flex; align-items: center; gap: 10px; }
    .btn-action {
      background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border);
      color: var(--text-muted); padding: 6px 12px; border-radius: var(--radius);
      cursor: pointer; font-size: 12px; font-weight: 500;
    }
    .btn-action:hover { background: rgba(255, 255, 255, 0.12); color: var(--text); }

    .compare-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 24px; background: var(--compare-bg); border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .compare-bar .selected { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .compare-chip {
      background: var(--primary-light); border: 1px solid var(--primary);
      padding: 4px 10px; border-radius: 20px; font-size: 12px; display: flex;
      align-items: center; gap: 8px; color: var(--text); font-weight: 500;
    }
    .compare-chip .remove { cursor: pointer; font-weight: bold; color: var(--primary); }
    .compare-btn {
      background: var(--primary); color: #fff; border: none; padding: 6px 14px;
      border-radius: 20px; font-weight: 600; cursor: pointer; font-size: 12px;
    }
    .compare-btn:disabled { background: var(--border); color: var(--text-muted); cursor: default; }

    .content-viewport { padding: 20px; overflow-y: auto; flex-grow: 1; scroll-behavior: smooth; }
    .comparison-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(460px, 1fr)); gap: 20px; align-items: start; }
    @media (max-width: 1080px) { .comparison-grid { grid-template-columns: 1fr; } }

    .card {
      position: relative; background: var(--card-bg); border: 1px solid var(--border);
      border-radius: var(--radius); display: flex; flex-direction: column;
      transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(0,0,0,.35); }
    .card.expanded { background: var(--card-expanded-bg); border-color: var(--border-accent); box-shadow: 0 4px 20px rgba(0,0,0,0.4); }

    .card::before, .card::after {
      content: ''; position: absolute; width: 12px; height: 12px; pointer-events: none; opacity: 0.4;
    }
    .card::before { top: -1px; left: -1px; border-top: 2px solid var(--primary); border-left: 2px solid var(--primary); }
    .card::after { bottom: -1px; right: -1px; border-bottom: 2px solid var(--primary); border-right: 2px solid var(--primary); }
    .card:hover::before, .card:hover::after, .card.expanded::before, .card.expanded::after { opacity: 1; }

    .card-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; background: rgba(0, 0, 0, 0.2); }
    .card-title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .product-brand { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .product-name { font-size: 1.15rem; font-weight: 700; color: var(--text); }

    .status-badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .status-owned { background: var(--badge-owned-bg); color: var(--badge-owned); }
    .status-wishlist { background: var(--badge-wishlist-bg); color: var(--badge-wishlist); }
    .status-alternative { background: var(--badge-alt-bg); color: var(--badge-alt); }

    .top-pick-tag { background: var(--primary-light); color: var(--primary); border: 1px solid var(--primary); padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; display: inline-block; }
    .card-summary { font-size: 13px; color: var(--text-muted); line-height: 1.4; }

    .compare-select {
      position: absolute; top: 12px; right: 12px; z-index: 2;
      width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border);
      background: var(--card-bg); cursor: pointer; display: flex; align-items: center;
      justify-content: center; font-size: 16px; color: var(--text-muted);
      transition: all .15s ease;
    }
    .compare-select:hover { border-color: var(--primary); color: var(--primary); }
    .compare-select.selected { background: var(--primary); border-color: var(--primary); color: #fff; }

    .quick-specs-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 12px 16px; background: rgba(0, 0, 0, 0.15); border-bottom: 1px solid var(--border); }
    .spec-pill-interactive { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); padding: 8px 10px; border-radius: 6px; display: flex; flex-direction: column; cursor: pointer; transition: all 0.15s ease; }
    .spec-pill-interactive:hover { background: var(--primary-light); border-color: var(--primary); }
    .spec-key { font-size: 10px; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
    .spec-val { font-size: 12px; font-weight: 600; color: var(--text); margin-top: 2px; }

    .card-expand-bar { padding: 12px 16px; background: rgba(255, 255, 255, 0.02); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; font-size: 12px; font-weight: 600; color: var(--primary); }
    .card-expand-bar:hover { background: rgba(99, 102, 241, 0.08); }

    .card-scroll-body { display: none; padding: 16px; flex-direction: column; gap: 12px; border-top: 1px solid var(--border); }
    .card.expanded .card-scroll-body { display: flex; }

    .sub-accordion { background: rgba(0, 0, 0, 0.25); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; scroll-margin-top: 80px; }
    .sub-accordion-header { padding: 12px 14px; font-size: 0.85rem; font-weight: 700; color: var(--text); display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; background: rgba(255, 255, 255, 0.02); transition: background 0.15s ease; }
    .sub-accordion-header:hover { background: rgba(255, 255, 255, 0.06); }
    .sub-accordion-title { display: flex; align-items: center; gap: 8px; color: var(--primary); }
    .sub-accordion-arrow { font-size: 10px; color: var(--text-muted); transition: transform 0.2s ease; }
    .sub-accordion.active .sub-accordion-arrow { transform: rotate(180deg); color: var(--primary); }
    .sub-accordion-body { display: none; padding: 14px; border-top: 1px solid var(--border); flex-direction: column; gap: 12px; background: rgba(0, 0, 0, 0.15); }
    .sub-accordion.active .sub-accordion-body { display: flex; }

    .pro-con-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .pro-con-item { font-size: 12px; padding: 6px 8px; border-radius: 6px; line-height: 1.3; }
    .pro-item { background: rgba(34, 197, 94, 0.08); border: 1px solid rgba(34, 197, 94, 0.2); color: #dcfce7; }
    .con-item { background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.2); color: #fee2e2; }

    .bullet-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .bullet-list li { position: relative; padding-left: 16px; font-size: 12px; color: #d1d5db; line-height: 1.4; }
    .bullet-list li::before { content: '•'; position: absolute; left: 0; color: var(--primary); font-weight: bold; }

    .comparison-box { background: rgba(99, 102, 241, 0.05); border: 1px solid rgba(99, 102, 241, 0.2); border-radius: 6px; padding: 10px 12px; font-size: 12px; color: #e2e8f0; line-height: 1.4; }

    .lifespan-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
    .lifespan-pill { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); padding: 8px 10px; border-radius: 6px; }

    .copy-item-card { background: rgba(0, 0, 0, 0.25); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .btn-copy { background: var(--primary-light); border: 1px solid var(--primary); color: var(--primary); padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; white-space: nowrap; }
    .btn-copy:hover { background: var(--primary); color: #fff; }

    .switch-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .switch-table th, .switch-table td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--border); }
    .switch-table th { color: var(--text-muted); font-size: 10px; text-transform: uppercase; font-weight: 700; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .buy-link { color: var(--primary); text-decoration: none; font-weight: 600; font-size: 12px; }
    .buy-link:hover { text-decoration: underline; }

    /* ---------- COMPARISON OVERLAY ---------- */
    .compare-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100;
      display: flex; flex-direction: column; padding: 20px; overflow-y: auto;
    }
    .compare-overlay.hidden { display: none; }
    .compare-overlay-header {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 16px; border-bottom: 1px solid var(--border);
    }
    .compare-overlay-header h2 { font-size: 1.4rem; }
    .close-overlay {
      background: var(--primary); border: none; color: #fff; font-size: 1.2rem;
      padding: 6px 14px; border-radius: 8px; cursor: pointer;
    }
    .compare-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 20px; }
    .compare-col { background: var(--card-bg); border-radius: var(--radius); padding: 20px; border: 1px solid var(--border); }
    .compare-col h3 { font-size: 1.1rem; margin-bottom: 12px; }
    .compare-spec-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .compare-spec-row .label { color: var(--text-muted); }
    .compare-spec-row .value { font-weight: 600; }
    .compare-pro-con { margin-top: 12px; }
    .compare-pro-con strong { color: var(--text-muted); font-size: 11px; text-transform: uppercase; }
        /* Mobile responsive */
    @media (max-width: 860px) {
      body { height: auto; overflow-y: auto; }
      #app { flex-direction: column; height: auto; min-height: 100vh; }
      sidebar {
        width: 100%; border-right: none; border-bottom: 1px solid var(--border);
        flex-direction: row; flex-wrap: wrap; align-items: center;
        padding: 8px 16px; gap: 8px;
      }
      .brand { border-bottom: none; padding: 0; }
      .nav-list {
        display: none; width: 100%; flex-direction: column; overflow-y: visible;
        padding: 8px 0 0; order: 3;
      }
      .nav-list.open { display: flex; }
      .nav-item { white-space: nowrap; }
      .hamburger {
        display: flex; flex-direction: column; gap: 4px; cursor: pointer;
        background: none; border: none; padding: 4px; margin-left: auto;
      }
      .hamburger span { display: block; width: 20px; height: 2px; background: var(--text); border-radius: 2px; }
      .comparison-grid { grid-template-columns: 1fr; }
      .content-viewport { padding: 12px; }
      header { flex-wrap: wrap; gap: 8px; }
      .search-box { width: 100%; }
      .compare-bar { flex-wrap: wrap; gap: 8px; }
    }

    @media (min-width: 861px) {
      .hamburger { display: none; }
    }
        /* ===== META BAR & FILTER CHIPS (missing styles) ===== */
    .meta-bar {
      display: flex; flex-direction: column; gap: 10px;
      padding: 2px 2px 18px; border-bottom: 1px solid var(--border); margin-bottom: 18px;
    }
    .meta-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
    .meta-stats { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; font-size: 12px; color: var(--text-muted); line-height: 1.6; }
    .meta-stats strong { color: var(--text); }
    .meta-divider { color: var(--text-faint); opacity: 0.4; }
    .invested-value { color: var(--primary); font-weight: 600; }

    .filter-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      all: unset; cursor: pointer; background: transparent;
      font-size: 11px; padding: 5px 11px; border-radius: 20px;
      border: 1px solid var(--border); color: var(--text-muted);
      transition: all .15s ease;
    }
    .chip:hover { border-color: var(--primary); color: var(--text); }
    .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
        /* ===== MOBILE HAMBURGER MENU ===== */
    @media (max-width: 860px) {
      body { height: auto; overflow-y: auto; }
      #app { flex-direction: column; height: auto; min-height: 100vh; }
      sidebar {
        width: 100%; border-right: none; border-bottom: 1px solid var(--border);
        flex-direction: row; flex-wrap: wrap; align-items: center;
        padding: 8px 16px; gap: 8px;
      }
      .brand { border-bottom: none; padding: 0; }
      .nav-list {
        display: none; width: 100%; flex-direction: column; overflow-y: visible;
        padding: 8px 0 0; order: 3;
      }
      .nav-list.open { display: flex; }
      .hamburger {
        display: flex; flex-direction: column; gap: 4px; cursor: pointer;
        background: none; border: none; padding: 4px; margin-left: auto;
      }
      .hamburger span { display: block; width: 20px; height: 2px; background: var(--text); border-radius: 2px; }
      .comparison-grid { grid-template-columns: 1fr; }
      .content-viewport { padding: 12px; }
      header { flex-wrap: wrap; gap: 8px; }
      .search-box { width: 100%; }
      .compare-bar { flex-wrap: wrap; gap: 8px; }
    }

    @media (min-width: 861px) {
      .hamburger { display: none; }
    }
  </style>
</head>
<body>
  <div id="app">
    <sidebar>
      <div class="brand">
        <div class="brand-icon">⚡</div>
        <span>Desk Directory</span>
      </div>
      <button class="hamburger" id="hamburgerBtn" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-list" id="categoryNav"></ul>
    </sidebar>

    <main>
      <header>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search across all hardware...">
        </div>
        <div class="controls-group">
          <button class="btn-action" id="btnExpandAll">Expand All Cards</button>
          <button class="btn-action" id="btnCollapseAll">Collapse All</button>
        </div>
      </header>

      <div class="compare-bar" id="compareBar">
        <div class="selected" id="compareSelected"><span style="color:var(--text-muted);">No items selected for comparison</span></div>
        <button class="compare-btn" id="compareBtn" disabled>Compare (0/2)</button>
      </div>

      <div class="content-viewport" id="viewport">
        <div class="meta-bar" id="metaBar"></div>
        <div class="comparison-grid" id="productList"></div>
      </div>
    </main>
  </div>

  <!-- COMPARE OVERLAY -->
  <div class="compare-overlay hidden" id="compareOverlay">
    <div class="compare-overlay-header">
      <h2>Side‑by‑side Comparison</h2>
      <button class="close-overlay" id="closeOverlay">✕ Close</button>
    </div>
    <div class="compare-columns" id="compareColumns"></div>
  </div>

  <script src="data-core.js"></script>
  <script src="data-mice.js"></script>
  <script src="data-monitors.js"></script>
  <script src="data-keyboards.js"></script>
  <script src="data-chairs.js"></script>
  <script src="data-desks.js"></script>
  <script src="data-gadgets.js"></script>
  <script src="data-assemble.js"></script>

  <script>
    (function () {
      const productList = document.getElementById('productList');
      if (!window.DESK_DATA) {
        productList.innerHTML = `<div class="empty-state"><h2>Data failed to load</h2><p>Ensure all data-*.js files are present.</p></div>`;
        return;
      }

      const { categories = [], products = [], microswitches = {} } = window.DESK_DATA;
      let activeCategory = categories[0]?.id || 'mice';
      let searchQuery = '';
      let statusFilter = 'all';
      let expandedCardIds = new Set();
      let activeSubSections = new Set();
      let compareList = new Set();

      const categoryNav = document.getElementById('categoryNav');
      const searchInput = document.getElementById('searchInput');
      const btnExpandAll = document.getElementById('btnExpandAll');
      const btnCollapseAll = document.getElementById('btnCollapseAll');
      const compareBar = document.getElementById('compareBar');
      const compareSelectedEl = document.getElementById('compareSelected');
      const compareBtn = document.getElementById('compareBtn');
      const compareOverlay = document.getElementById('compareOverlay');
      const compareColumns = document.getElementById('compareColumns');
      const closeOverlay = document.getElementById('closeOverlay');

      function init() {
        renderNav(); setupEventListeners(); handleHashRoute(); renderMetaBar(); renderProducts(); updateCompareBar();
      }

      function handleHashRoute() {
        const hash = location.hash.replace('#', '');
        if (hash) {
          const matched = categories.find(c => c.id === hash);
          if (matched) activeCategory = matched.id;
        }
      }

      function renderNav() {
        categoryNav.innerHTML = categories.map(cat => {
          const count = products.filter(p => p && p.category === cat.id).length;
          return `<li class="nav-item ${cat.id === activeCategory ? 'active' : ''}" data-cat="${cat.id}">
            <span>${cat.label}</span><span class="counter-badge">${count}</span></li>`;
        }).join('');
      }

      function parsePrice(str) { if (!str) return NaN; const nums = String(str).match(/[\d,]+(?:\.\d+)?/g); if (!nums || !nums.length) return NaN; const vals = nums.map(n => parseFloat(n.replace(/,/g, ''))); return vals.reduce((a,b)=>a+b,0)/vals.length; }

      function getFilteredProducts() {
        return products.filter(p => {
          if (!p) return false;
          const matchesCategory = p.category === activeCategory;
          if (statusFilter !== 'all' && p.status !== statusFilter) return false;
          const query = searchQuery.toLowerCase();
          return matchesCategory && (!query || (p.name&&p.name.toLowerCase().includes(query))||(p.brand&&p.brand.toLowerCase().includes(query))||(p.tags&&Array.isArray(p.tags)&&p.tags.some(t=>String(t).toLowerCase().includes(query)))||(p.summary&&p.summary.toLowerCase().includes(query)));
        });
      }

      function renderMetaBar() {
        const catItems = products.filter(p=>p&&p.category===activeCategory);
        const filtered = getFilteredProducts();
        const owned = catItems.filter(p=>p.status==='Owned').length;
        const wish = catItems.filter(p=>p.status==='Wishlist').length;
        const alt = catItems.filter(p=>p.status==='Alternative').length;
        const invested = catItems.filter(p=>p.status==='Owned').reduce((s,p)=>s+(parsePrice(p.price)||0),0);
        const metaBarEl = document.getElementById('metaBar');
        if(!metaBarEl) return;
        metaBarEl.innerHTML = `<div class="meta-row"><div class="meta-stats">
          <span><strong>${filtered.length}</strong> shown</span><span class="meta-divider">/</span>
          <span><strong>${catItems.length}</strong> logged</span>
          ${catItems.length ? `<span class="meta-divider">·</span><span style="color:var(--badge-owned);">${owned} owned</span><span style="color:var(--badge-wishlist);">${wish} wishlist</span><span style="color:var(--badge-alt);">${alt} alt</span><span class="meta-divider">·</span><span class="invested-value">$${invested.toFixed(0)} invested</span>` : ''}

                            <div style="background:rgba(255,255,255,0.03); padding:6px 8px; border-radius:4px; font-size:11px;">
                              <div style="color:var(--text-muted); text-transform:uppercase; font-size:9px;">${k}</div>
                              <div style="font-weight:600; margin-top:2px;">${v}</div>
                            </div>
                          `).join('')}
                        </div>
                      </div>
                    </div>
                  ` : ''}

                  <!-- 11. PROS & CONS -->
                  ${(pros.length > 0 || cons.length > 0) ? `
                    <div class="sub-accordion ${activeSubSections.has(`${item.id}:proscons`) ? 'active' : ''}" id="sub-${item.id}-proscons">
                      <div class="sub-accordion-header" onclick="window.deskApp.toggleSub('${item.id}', 'proscons')">
                        <span class="sub-accordion-title">⚖️ Advantages & Disadvantages</span>
                        <span class="sub-accordion-arrow">▼</span>
                      </div>
                      <div class="sub-accordion-body">
                        <div class="pro-con-grid">
                          <div style="display:flex; flex-direction:column; gap:6px;">${pros.map(p => `<div class="pro-con-item pro-item">✓ ${p}</div>`).join('')}</div>
                          <div style="display:flex; flex-direction:column; gap:6px;">${cons.map(c => `<div class="pro-con-item con-item">✕ ${c}</div>`).join('')}</div>
                        </div>
                      </div>
                    </div>
                  ` : ''}

                  <!-- 12. SWITCH MAPPINGS -->
                  ${switchMappings.length > 0 ? `
                    <div class="sub-accordion ${activeSubSections.has(`${item.id}:switches`) ? 'active' : ''}" id="sub-${item.id}-switches">
                      <div class="sub-accordion-header" onclick="window.deskApp.toggleSub('${item.id}', 'switches')">
                        <span class="sub-accordion-title">🔌 Per-Button Custom Microswitch Recommendations</span>
                        <span class="sub-accordion-arrow">▼</span>
                      </div>
                      <div class="sub-accordion-body">
                        <table class="switch-table">
                          <thead><tr><th>Button Zone</th><th>Recommended Switch</th><th>Tactile, Durability & Acoustic Reason</th></tr></thead>
                          <tbody>
                            ${switchMappings.map(m => {
                              const sw = (microswitches && microswitches[m.recommendedSwitchId]) ? microswitches[m.recommendedSwitchId] : {};
                              return `
                                <tr>
                                  <td><strong>${m.buttonGroup || 'Button'}</strong></td>
                                  <td><div><strong>${sw.name || m.recommendedSwitchId || 'Switch'}</strong></div><div style="color:var(--text-muted); font-size:10px;">${sw.force || ''} | ${sw.lifespan || ''}</div></td>
                                  <td style="color:var(--text-muted); font-size:11px;">${m.reason || sw.feel || ''}</td>
                                </tr>
                              `;
                            }).join('')}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  ` : ''}

                  <!-- 13. SETUP NOTES -->
                  ${setupNotes.length > 0 ? `
                    <div class="sub-accordion ${activeSubSections.has(`${item.id}:notes`) ? 'active' : ''}" id="sub-${item.id}-notes">
                      <div class="sub-accordion-header" onclick="window.deskApp.toggleSub('${item.id}', 'notes')">
                        <span class="sub-accordion-title">🔧 Step-by-Step Modding & Wiring Bullet Notes</span>
                        <span class="sub-accordion-arrow">▼</span>
                      </div>
                      <div class="sub-accordion-body">
                        <ul class="bullet-list">${setupNotes.map(n => `<li>${n}</li>`).join('')}</ul>
                      </div>
                    </div>
                  ` : ''}

                  ${item.purchaseUrl ? `
                    <div style="display:flex; justify-content:flex-end; padding-top:4px;">
                      <a href="${item.purchaseUrl}" target="_blank" class="buy-link">Official Buy Page ↗</a>
                    </div>
                  ` : ''}

                </div>

                <!-- Card Expand Footer Bar -->
                <div class="card-expand-bar" onclick="window.deskApp.toggleCard('${item.id}')">
                  <span>${isExpanded ? '▲ Close Card Sections' : '▼ Expand Sub-Sections'}</span>
                  <span>${item.price || ''}</span>
                </div>

              </div>
            `;
          }).join('');
        } catch (err) {
          productList.innerHTML = `
            <div class="empty-state">
              <h3>Error rendering directory</h3>
              <p style="color:#f87171; margin-top:6px;">${err.message}</p>
            </div>`;
        }
      }

      function toggleCard(id) { if(expandedCardIds.has(id)) expandedCardIds.delete(id); else expandedCardIds.add(id); renderProducts(); }
      function toggleSub(cardId,subKey) { const key=`${cardId}:${subKey}`; if(activeSubSections.has(key)) activeSubSections.delete(key); else activeSubSections.add(key); renderProducts(); }
      function openAndJump(cardId,subKey) { expandedCardIds.add(cardId); activeSubSections.add(`${cardId}:${subKey}`); renderProducts(); setTimeout(()=>{ const el=document.getElementById(`sub-${cardId}-${subKey}`); if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); else document.getElementById(`card-${cardId}`)?.scrollIntoView({behavior:'smooth',block:'center'}); },60); }
      function copyText(str,btn) { navigator.clipboard.writeText(str).then(()=>{ const orig=btn.innerText; btn.innerText='Copied! ✓'; btn.style.background='#22c55e'; btn.style.color='#fff'; setTimeout(()=>{ btn.innerText=orig; btn.style.background=''; btn.style.color=''; },1500); }).catch(()=>alert('Copy failed: '+str)); }

      function setupEventListeners() {
        const metaBar = document.getElementById('metaBar');
        if(metaBar) metaBar.addEventListener('click', e => { const chip = e.target.closest('.chip'); if(!chip) return; statusFilter = chip.dataset.status; renderMetaBar(); renderProducts(); });
        categoryNav.addEventListener('click', e => { const nav = e.target.closest('.nav-item'); if(!nav) return; activeCategory = nav.dataset.cat; statusFilter='all'; location.hash=activeCategory; expandedCardIds.clear(); activeSubSections.clear(); renderNav(); renderMetaBar(); renderProducts(); });
        searchInput.addEventListener('input', e => { searchQuery = e.target.value; renderProducts(); });
        btnExpandAll.addEventListener('click', () => { getFilteredProducts().forEach(p => { expandedCardIds.add(p.id); ['procurement','repairability','weight','software','glides','lifespan','stock','mods','ergonomics','properties','switches','proscons','notes'].forEach(k=>activeSubSections.add(`${p.id}:${k}`)); if(activeCategory==='monitors') activeSubSections.add(`${p.id}:panel`); if(activeCategory==='keyboards') activeSubSections.add(`${p.id}:switches`); }); renderProducts(); });
        btnCollapseAll.addEventListener('click', () => { expandedCardIds.clear(); activeSubSections.clear(); renderProducts(); });
        compareBtn.addEventListener('click', showCompare);
        closeOverlay.addEventListener('click', hideCompare);
        window.addEventListener('keydown', e => { if(e.key==='Escape') hideCompare(); });
      }

      window.deskApp = { toggleCard, toggleSub, openAndJump, copyText, toggleCompare, showCompare };
            // Mobile hamburger toggle
      const hamburgerBtn = document.getElementById('hamburgerBtn');
      const navList = document.getElementById('categoryNav');
      if (hamburgerBtn && navList) {
        hamburgerBtn.addEventListener('click', () => {
          navList.classList.toggle('open');
        });
        // Close menu when a category is clicked
        navList.addEventListener('click', (e) => {
          if (e.target.closest('.nav-item')) {
            navList.classList.remove('open');
          }
        });
      }
      init();
    })();
  </script>
    <!-- Google Translate Widget -->
  <div id="google_translate_element" style="position:fixed; bottom:16px; right:16px; z-index:200;"></div>
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'zh-CN,en',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
