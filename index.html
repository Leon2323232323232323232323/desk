<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desk Setup & Hardware Directory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f17;
      --sidebar-bg: #111827;
      --card-bg: #1f2937;
      --card-expanded-bg: #162032;
      --border: #374151;
      --border-accent: #6366f1;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --primary: #6366f1;
      --primary-light: rgba(99, 102, 241, 0.15);
      --badge-owned-bg: rgba(34, 197, 94, 0.15);
      --badge-owned: #4ade80;
      --badge-wishlist-bg: rgba(234, 179, 8, 0.15);
      --badge-wishlist: #fde047;
      --badge-alt-bg: rgba(239, 68, 68, 0.15);
      --badge-alt: #f87171;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
      font-size: 14px;
      line-height: 1.5;
    }

    #app { display: flex; width: 100%; height: 100%; }

    sidebar {
      width: 250px;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .brand {
      padding: 18px 20px;
      font-size: 1.1rem;
      font-weight: 700;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 26px;
      height: 26px;
      background: var(--primary);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    .nav-list { list-style: none; padding: 12px 8px; overflow-y: auto; flex-grow: 1; }

    .nav-item {
      padding: 10px 12px;
      margin-bottom: 4px;
      border-radius: var(--radius);
      cursor: pointer;
      color: var(--text-muted);
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s ease;
    }

    .nav-item:hover { background-color: rgba(255, 255, 255, 0.05); color: var(--text); }
    .nav-item.active { background-color: var(--primary-light); color: var(--primary); font-weight: 600; }

    .counter-badge {
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      color: var(--text-muted);
    }

    main { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }

    header {
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--sidebar-bg);
    }

    .search-box { position: relative; width: 340px; }

    .search-box input {
      width: 100%;
      padding: 8px 12px 8px 36px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      outline: none;
      font-size: 13px;
    }

    .search-box input:focus { border-color: var(--primary); }
    .search-box::before {
      content: '🔍';
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 12px;
      opacity: 0.5;
    }

    .controls-group { display: flex; align-items: center; gap: 10px; }

    .btn-action {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }

    .btn-action:hover { background: rgba(255, 255, 255, 0.12); color: var(--text); }

    .content-viewport { padding: 20px; overflow-y: auto; flex-grow: 1; }

    .comparison-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 1080px) { .comparison-grid { grid-template-columns: 1fr; } }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      transition: border-color 0.15s ease;
      max-height: 860px;
      overflow: hidden;
    }

    .card.expanded {
      background: var(--card-expanded-bg);
      border-color: var(--border-accent);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .card-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(0, 0, 0, 0.2);
    }

    .card-title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .product-brand { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .product-name { font-size: 1.15rem; font-weight: 700; color: var(--text); }

    .status-badge {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .status-owned { background: var(--badge-owned-bg); color: var(--badge-owned); }
    .status-wishlist { background: var(--badge-wishlist-bg); color: var(--badge-wishlist); }
    .status-alternative { background: var(--badge-alt-bg); color: var(--badge-alt); }

    .top-pick-tag {
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      display: inline-block;
    }

    .card-summary { font-size: 13px; color: var(--text-muted); line-height: 1.4; }

    /* Interactive Quick Spec Pills */
    .quick-specs-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.15);
      border-bottom: 1px solid var(--border);
    }

    .spec-pill-interactive {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 10px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .spec-pill-interactive:hover {
      background: var(--primary-light);
      border-color: var(--primary);
    }

    .spec-key { font-size: 10px; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
    .spec-val { font-size: 12px; font-weight: 600; color: var(--text); margin-top: 2px; }

    .card-expand-bar {
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.02);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      font-size: 12px;
      font-weight: 600;
      color: var(--primary);
    }

    .card-expand-bar:hover { background: rgba(99, 102, 241, 0.08); }

    /* Internal Scroll Area */
    .card-scroll-body {
      display: none;
      padding: 16px;
      overflow-y: auto;
      max-height: 540px;
      flex-direction: column;
      gap: 12px;
      border-top: 1px solid var(--border);
    }

    .card.expanded .card-scroll-body { display: flex; }

    /* Sub-Accordion Component */
    .sub-accordion {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .sub-accordion-header {
      padding: 12px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      background: rgba(255, 255, 255, 0.02);
      transition: background 0.15s ease;
    }

    .sub-accordion-header:hover { background: rgba(255, 255, 255, 0.06); }

    .sub-accordion-title { display: flex; align-items: center; gap: 8px; color: var(--primary); }

    .sub-accordion-arrow {
      font-size: 10px;
      color: var(--text-muted);
      transition: transform 0.2s ease;
    }

    .sub-accordion.active .sub-accordion-arrow { transform: rotate(180deg); color: var(--primary); }

    .sub-accordion-body {
      display: none;
      padding: 14px;
      border-top: 1px solid var(--border);
      flex-direction: column;
      gap: 12px;
      background: rgba(0, 0, 0, 0.15);
    }

    .sub-accordion.active .sub-accordion-body { display: flex; }

    .pro-con-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .pro-con-item { font-size: 12px; padding: 6px 8px; border-radius: 6px; line-height: 1.3; }
    .pro-item { background: rgba(34, 197, 94, 0.08); border: 1px solid rgba(34, 197, 94, 0.2); color: #dcfce7; }
    .con-item { background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.2); color: #fee2e2; }

    .bullet-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .bullet-list li {
      position: relative;
      padding-left: 16px;
      font-size: 12px;
      color: #d1d5db;
      line-height: 1.4;
    }

    .bullet-list li::before {
      content: '•';
      position: absolute;
      left: 0;
      color: var(--primary);
      font-weight: bold;
    }

    .comparison-box {
      background: rgba(99, 102, 241, 0.05);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 12px;
      color: #e2e8f0;
      line-height: 1.4;
    }

    .switch-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .switch-table th, .switch-table td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--border); }
    .switch-table th { color: var(--text-muted); font-size: 10px; text-transform: uppercase; font-weight: 700; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }

    .buy-link { color: var(--primary); text-decoration: none; font-weight: 600; font-size: 12px; }
    .buy-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div id="app">
    <sidebar>
      <div class="brand">
        <div class="brand-icon">⚡</div>
        <span>Desk Directory</span>
      </div>
      <ul class="nav-list" id="categoryNav"></ul>
    </sidebar>

    <main>
      <header>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search mouse, switches, specs, mods...">
        </div>
        <div class="controls-group">
          <button class="btn-action" id="btnExpandAll">Expand All Cards</button>
          <button class="btn-action" id="btnCollapseAll">Collapse All</button>
        </div>
      </header>

      <div class="content-viewport">
        <div class="comparison-grid" id="productList"></div>
      </div>
    </main>
  </div>

  <script src="data.js"></script>

  <script>
    (function () {
      const productList = document.getElementById('productList');

      if (!window.DESK_DATA) {
        productList.innerHTML = `
          <div class="empty-state">
            <h2>data.js file missing or failed to load!</h2>
            <p style="margin-top:8px">Ensure <code>data.js</code> and <code>index.html</code> are in the exact same folder.</p>
          </div>`;
        return;
      }

      const { categories = [], products = [], microswitches = {} } = window.DESK_DATA;

      let activeCategory = categories[0]?.id || 'mice';
      let searchQuery = '';
      let expandedCardIds = new Set();
      let activeSubSections = new Set(); // Stores "cardId:subSectionKey"

      const categoryNav = document.getElementById('categoryNav');
      const searchInput = document.getElementById('searchInput');
      const btnExpandAll = document.getElementById('btnExpandAll');
      const btnCollapseAll = document.getElementById('btnCollapseAll');

      function init() {
        renderNav();
        setupEventListeners();
        handleHashRoute();
        renderProducts();
      }

      function handleHashRoute() {
        const hash = location.hash.replace('#', '');
        if (hash) {
          const matchedCategory = categories.find(c => c.id === hash);
          if (matchedCategory) activeCategory = matchedCategory.id;
        }
      }

      function renderNav() {
        categoryNav.innerHTML = categories.map(cat => {
          const count = products.filter(p => p.category === cat.id).length;
          return `
            <li class="nav-item ${cat.id === activeCategory ? 'active' : ''}" data-cat="${cat.id}">
              <span>${cat.label}</span>
              <span class="counter-badge">${count}</span>
            </li>
          `;
        }).join('');
      }

      function getFilteredProducts() {
        return products.filter(p => {
          const matchesCategory = p.category === activeCategory;
          const query = searchQuery.toLowerCase();
          return matchesCategory && (!query || 
            p.name.toLowerCase().includes(query) ||
            p.brand.toLowerCase().includes(query) ||
            (p.tags && p.tags.some(t => t.toLowerCase().includes(query))) ||
            (p.summary && p.summary.toLowerCase().includes(query))
          );
        });
      }

      function renderProducts() {
        const filtered = getFilteredProducts();

        if (filtered.length === 0) {
          productList.innerHTML = `
            <div class="empty-state">
              <h3>No items match your search</h3>
              <p style="margin-top: 6px;">Try clearing search filters or selecting another category.</p>
            </div>`;
          return;
        }

        productList.innerHTML = filtered.map(item => {
          const isExpanded = expandedCardIds.has(item.id);
          const statusClass = item.status === 'Owned' ? 'status-owned' : (item.status === 'Alternative' ? 'status-alternative' : 'status-wishlist');
          const props = item.properties || {};

          return `
            <div class="card ${isExpanded ? 'expanded' : ''}" id="card-${item.id}">
              
              <!-- Card Header -->
              <div class="card-header">
                <div class="card-title-row">
                  <div>
                    <span class="product-brand">${item.brand}</span>
                    <div class="product-name">${item.name}</div>
                  </div>
                  <span class="status-badge ${statusClass}">${item.status || 'Wishlist'}</span>
                </div>

                ${item.isTopPick ? `<div><span class="top-pick-tag">★ ${item.topPickBadge || 'Top Pick'}</span></div>` : ''}

                <div class="card-summary">${item.summary || ''}</div>
              </div>

              <!-- Interactive Spec Pills (Clicking opens card and expands section) -->
              <div class="quick-specs-grid">
                <div class="spec-pill-interactive" onclick="window.deskApp.openAndJump('${item.id}', 'ergonomics')">
                  <span class="spec-key">Ergonomic Score ↗</span>
                  <span class="spec-val">${props["Ergonomic Rating"] || 'N/A'}</span>
                </div>
                <div class="spec-pill-interactive" onclick="window.deskApp.openAndJump('${item.id}', 'performance')">
                  <span class="spec-key">Weight Profile ↗</span>
                  <span class="spec-val">${props["Weight Profile"] || props["Weight"] || 'N/A'}</span>
                </div>
                <div class="spec-pill-interactive" onclick="window.deskApp.openAndJump('${item.id}', 'ergonomics')">
                  <span class="spec-key">Grip Style ↗</span>
                  <span class="spec-val">${props["Grip Style Match"] || 'N/A'}</span>
                </div>
                <div class="spec-pill-interactive" onclick="window.deskApp.openAndJump('${item.id}', 'switches')">
                  <span class="spec-key">Switch Sockets ↗</span>
                  <span class="spec-val">${props["Switch Mounting"] || 'N/A'}</span>
                </div>
              </div>

              <!-- Internal Scroll Body (Contains Simple Collapsible Sub-Sections) -->
              <div class="card-scroll-body">
                
                <!-- 1. ERGONOMICS & COMPARISON -->
                ${item.ergonomicDetails ? `
                  <div class="sub-accordion ${activeSubSections.has(`${item.id}:ergonomics`) ? 'active' : ''}">
                    <div class="sub-accordion-header" onclick="window.deskApp.toggleSub('${item.id}', 'ergonomics')">
                      <span class="sub-accordion-title">📐 Ergonomics & Multi-Mouse Comparison</span>
                      <span class="sub-accordion-arrow">▼</span>
                    </div>
                    <div class="sub-accordion-body">
                      <div>
                        <strong>Why this Ergonomic Score (${props["Ergonomic Rating"] || ''}):</strong>
                        <p style="font-size:12px; color:var(--text-muted); margin-top:2px;">${item.ergonomicDetails.scoreReason}</p>
                      </div>

                      <div class="comparison-box">
                        <strong>⚔️ Comparison Against Other Mice:</strong>
                        <p style="margin-top:4px;">${item.ergonomicDetails.comparisonVsOthers}</p>
                      </div>

                      <div style="font-size:12px;">
                        <div><strong>Hand Size & Grip Match:</strong> ${item.ergonomicDetails.gripCompatibility}</div>
                        <div style="margin-top:4px;"><strong>Wrist & Forearm Posture:</strong> ${item.ergonomicDetails.wristAndPosture}</div>
                      </div>
                    </div>
                  </div>
                ` : ''}

                <!-- 2. TECHNICAL SPECS -->
                ${item.properties ? `
                  <div class="sub-accordion ${activeSubSections.has(`${item.id}:properties`) ? 'active' : ''}">
                    <div class="sub-accordion-header" onclick="window.deskApp.toggleSub('${item.id}', 'properties')">
                      <span class="sub-accordion-title">⚡ Performance, Sensor & Battery Specs</span>
                      <span class="sub-accordion-arrow">▼</span>
                    </div>
                    <div class="sub-accordion-body">
                      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:6px;">
                        ${Object.entries(item.properties).map(([k, v]) => `
                          <div style="background:rgba(255,255,255,0.03); padding:6px 8px; border-radius:4px; font-size:11px;">
                            <div style="color:var(--text-muted); text-transform:uppercase; font-size:9px;">${k}</div>
                            <div style="font-weight:600; margin-top:2px;">${v}</div>
                          </div>
